name: Frontend Workflow (CI/CD)
on:
  push:
    branches: [main,test,dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main,test,dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read
  packages: write

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend 
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
  docker-build:
    name: Docker build
    if: ${{ github.event_name == 'push'}}
    needs: [syntax-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Tags
        id: generatetag
        shell: bash
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/frontend
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tags=("${IMAGE_REGISTRY}:${BRANCH}" "${IMAGE_REGISTRY}:${SHA}")
          if [ "$BRANCH" = "main" ]; then
            tags=("${IMAGE_REGISTRY}:latest" "${tags[@]}")
          fi
          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF" 
          } >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.generatetag.outputs.tags }}
