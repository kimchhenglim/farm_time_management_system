name: Backend Workflow (CI/CD)
on:
  push:
    branches: [main,test,dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main,test,dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend 
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
  docker-build:
    name: Docker build
    if: ${{ github.event_name == 'push'}}
    needs: [syntax-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Tags
        id: generatetag
        shell: bash
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}/backend
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tags=("${IMAGE_REGISTRY}:${BRANCH}" "${IMAGE_REGISTRY}:${SHA}")
          if [ "$BRANCH" = "main" ]; then
            tags=("${IMAGE_REGISTRY}:latest" "${tags[@]}")
          fi
          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF" 
          } >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.generatetag.outputs.tags }}
